name: 'CI'

on: # Build any PRs and main branch changes
  workflow_dispatch: # Allows to run the workflow manually from the Actions tab
  pull_request:
    types:
      - opened
      - synchronize
  push:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  tests-parser:
    name: Tests - Parser
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Basic test
        id: basic-test
        uses: ./
        with:
          path: tests/data/basic-test.json
          dependency: php
          with-summary: false

      - name: Validate "Basic test"
        shell: bash
        env:
          ACTUAL_MIN: "${{ steps.basic-test.outputs.min }}"
          EXPECTED_MIN: "8.0"
          ACTUAL_MAX: "${{ steps.basic-test.outputs.max }}"
          EXPECTED_MAX: "8.4"
          ACTUAL_NEXT: "${{ steps.basic-test.outputs.next }}"
          EXPECTED_NEXT: "8.5"
        run: |
          if [[ "$ACTUAL_MIN" != "$EXPECTED_MIN" ]]; then
            echo "::error::Invalid min version: expected '$EXPECTED_MIN', got '$ACTUAL_MIN' !"
            exit 1
          elif [[ "$ACTUAL_MAX" != "$EXPECTED_MAX" ]]; then
            echo "::error::Invalid max version: expected '$EXPECTED_MAX', got '$ACTUAL_MAX' !"
            exit 1
          elif [[ "$ACTUAL_NEXT" != "$EXPECTED_NEXT" ]]; then
            echo "::error::Invalid next version: expected '$EXPECTED_NEXT', got '$ACTUAL_NEXT' !"
            exit 1
          fi

      - name: Without next version
        id: without-next-version-test
        uses: ./
        with:
          path: tests/data/basic-test.json
          dependency: symfony
          with-summary: false

      - name: Validate "Without next version"
        shell: bash
        env:
          ACTUAL_MIN: "${{ steps.without-next-version-test.outputs.min }}"
          EXPECTED_MIN: "4.4"
          ACTUAL_MAX: "${{ steps.without-next-version-test.outputs.max }}"
          EXPECTED_MAX: "6.4"
          ACTUAL_NEXT: "${{ steps.without-next-version-test.outputs.next }}"
          EXPECTED_NEXT: "null"
        run: |
          if [[ "$ACTUAL_MIN" != "$EXPECTED_MIN" ]]; then
            echo "::error::Invalid min version: expected '$EXPECTED_MIN', got '$ACTUAL_MIN' !"
            exit 1
          elif [[ "$ACTUAL_MAX" != "$EXPECTED_MAX" ]]; then
            echo "::error::Invalid max version: expected '$EXPECTED_MAX', got '$ACTUAL_MAX' !"
            exit 1
          elif [[ "$ACTUAL_NEXT" != "$EXPECTED_NEXT" ]]; then
            echo "::error::Invalid next version: expected '$EXPECTED_NEXT', got '$ACTUAL_NEXT' !"
            exit 1
          fi

      - name: Unknown dependency
        id: unknown-dep-test
        continue-on-error: true
        uses: ./
        with:
          path: tests/data/basic-test.json
          dependency: unknown-dep
          with-summary: false

      - name: Validate "Unknown dependency"
        shell: bash
        env:
          ACTUAL_OUTCOME: "${{ steps.unknown-dep-test.outcome }}"
          EXPECTED_OUTCOME: "failure"
          ACTUAL_CONCLUSION: "${{ steps.unknown-dep-test.conclusion }}"
          EXPECTED_CONCLUSION: "success"
          ACTUAL_OUTPUTS: "${{ toJSON(steps.unknown-dep-test.outputs) }}"
          EXPECTED_OUTPUTS: '{"min":"","max":"","next":""}'
        run: |
          if [[ "$ACTUAL_OUTCOME" != "$EXPECTED_OUTCOME" ]]; then
            echo "::error::Invalid outcome: expected '$EXPECTED_OUTCOME', got '$ACTUAL_OUTCOME' !"
            exit 1
          elif [[ "$ACTUAL_CONCLUSION" != "$EXPECTED_CONCLUSION" ]]; then
            echo "::error::Invalid conclusion: expected '$EXPECTED_CONCLUSION', got '$ACTUAL_CONCLUSION' !"
            exit 1
          fi
          ACTUAL_JSON=$(echo "$ACTUAL_OUTPUTS" |  jq -c "." )
          if [[ "$ACTUAL_JSON" != "$EXPECTED_OUTPUTS" ]]; then
            echo "::error::Invalid outputs: expected '$EXPECTED_OUTPUTS', got '$ACTUAL_JSON' !"
            exit 1
          fi

      - name: Unknown file test
        id: unknown-file-test
        continue-on-error: true
        uses: ./
        with:
          path: a/non/existent/file
          dependency: php
          with-summary: false

      - name: Validate "Unknown file test"
        shell: bash
        env:
          ACTUAL_OUTCOME: "${{ steps.unknown-file-test.outcome }}"
          EXPECTED_OUTCOME: "failure"
          ACTUAL_CONCLUSION: "${{ steps.unknown-file-test.conclusion }}"
          EXPECTED_CONCLUSION: "success"
          ACTUAL_OUTPUTS: "${{ toJSON(steps.unknown-file-test.outputs) }}"
          EXPECTED_OUTPUTS: '{"min":"","max":"","next":""}'
        run: |
          if [[ "$ACTUAL_OUTCOME" != "$EXPECTED_OUTCOME" ]]; then
            echo "::error::Invalid outcome: expected '$EXPECTED_OUTCOME', got '$ACTUAL_OUTCOME' !"
            exit 1
          elif [[ "$ACTUAL_CONCLUSION" != "$EXPECTED_CONCLUSION" ]]; then
            echo "::error::Invalid conclusion: expected '$EXPECTED_CONCLUSION', got '$ACTUAL_CONCLUSION' !"
            exit 1
          fi
          ACTUAL_JSON=$(echo "$ACTUAL_OUTPUTS" |  jq -c "." )
          if [[ "$ACTUAL_JSON" != "$EXPECTED_OUTPUTS" ]]; then
            echo "::error::Invalid outputs: expected '$EXPECTED_OUTPUTS', got '$ACTUAL_JSON' !"
            exit 1
          fi

  tests-downloader:
    name: Tests - Downloader
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Basic test
        id: basic-test
        uses: ./github-downloader
        with:
          file-path: tests/data/basic-test.json

      - name: Validate "Basic test"
        shell: bash
        env:
          ACTUAL_PATH: "${{ steps.basic-test.outputs.path }}"
          EXPECTED_PATH: '${{ runner.temp }}/supported-versions.json'
        run: |
          if [[ "$ACTUAL_PATH" != "$EXPECTED_PATH" ]]; then
            echo "::error::Invalid path: expected '$EXPECTED_PATH', got '$ACTUAL_PATH' !"
            exit 1
          fi
          if [[ ! -f "$ACTUAL_PATH" ]]; then
            echo '::error::File doesn'"'"'t exist !'
            exit 1
          elif [[ ! -r "$ACTUAL_PATH" ]]; then
            echo '::error::File is not readable !'
            exit 1
          fi

      - name: Invalid path test
        id: invalid-path-test
        continue-on-error: true
        uses: ./github-downloader
        with:
          file-path: a/non/existent/file

      - name: Validate "Invalid path test"
        shell: bash
        env:
          ACTUAL_OUTCOME: "${{ steps.invalid-path-test.outcome }}"
          EXPECTED_OUTCOME: "failure"
          ACTUAL_CONCLUSION: "${{ steps.invalid-path-test.conclusion }}"
          EXPECTED_CONCLUSION: "success"
          ACTUAL_OUTPUTS: "${{ toJSON(steps.invalid-path-test.outputs) }}"
          EXPECTED_OUTPUTS: '{"path":""}'
        run: |
          if [[ "$ACTUAL_OUTCOME" != "$EXPECTED_OUTCOME" ]]; then
            echo "::error::Invalid outcome: expected '$EXPECTED_OUTCOME', got '$ACTUAL_OUTCOME' !"
            exit 1
          elif [[ "$ACTUAL_CONCLUSION" != "$EXPECTED_CONCLUSION" ]]; then
            echo "::error::Invalid conclusion: expected '$EXPECTED_CONCLUSION', got '$ACTUAL_CONCLUSION' !"
            exit 1
          fi
          ACTUAL_JSON=$(echo "$ACTUAL_OUTPUTS" |  jq -c "." )
          if [[ "$ACTUAL_JSON" != "$EXPECTED_OUTPUTS" ]]; then
            echo "::error::Invalid outputs: expected '$EXPECTED_OUTPUTS', got '$ACTUAL_JSON' !"
            exit 1
          fi

  tests-updater:
    name: Tests - Updater
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Fetch original versions for "Basic test"
        id: fetch-basic-test-original-versions
        uses: ./
        with:
          path: tests/data/basic-test.json
          dependency: symfony
          with-summary: false

      - name: Basic test
        uses: ./updater
        with:
          path: tests/data/basic-test.json
          dependency: symfony
          version: max
          value: 5.2

      - name: Fetch updated versions for "Basic test"
        id: fetch-basic-test-updated-versions
        uses: ./
        with:
          path: tests/data/basic-test.json
          dependency: symfony
          with-summary: false

      - name: Validate "Basic test"
        shell: bash
        env:
          ACTUAL_MIN: "${{ steps.fetch-basic-test-updated-versions.outputs.min }}"
          EXPECTED_MIN: "${{ steps.fetch-basic-test-original-versions.outputs.min }}" # Not expected to be updated
          ACTUAL_MAX: "${{ steps.fetch-basic-test-updated-versions.outputs.max }}"
          EXPECTED_MAX: "5.2"
          ACTUAL_NEXT: "${{ steps.fetch-basic-test-updated-versions.outputs.next }}"
          EXPECTED_NEXT: "${{ steps.fetch-basic-test-original-versions.outputs.next }}" # Not expected to be updated
        run: |
          if [[ "$ACTUAL_MIN" != "$EXPECTED_MIN" ]]; then
            echo "::error::Invalid min version: expected '$EXPECTED_MIN', got '$ACTUAL_MIN' !"
            exit 1
          elif [[ "$ACTUAL_MAX" != "$EXPECTED_MAX" ]]; then
            echo "::error::Invalid max version: expected '$EXPECTED_MAX', got '$ACTUAL_MAX' !"
            exit 1
          elif [[ "$ACTUAL_NEXT" != "$EXPECTED_NEXT" ]]; then
            echo "::error::Invalid next version: expected '$EXPECTED_NEXT', got '$ACTUAL_NEXT' !"
            exit 1
          fi

      - name: Fetch original versions for "Empty versions"
        id: fetch-empty-versions-test-original-versions
        uses: ./
        with:
          path: tests/data/basic-test.json
          dependency: php
          with-summary: false

      - name: Empty versions - "null" value
        uses: ./updater
        with:
          path: tests/data/basic-test.json
          dependency: php
          version: min
          value: "null"

      - name: Empty versions - Empty value
        uses: ./updater
        with:
          path: tests/data/basic-test.json
          dependency: php
          version: max
          value: ""

      - name: Fetch updated versions for "Empty versions"
        id: fetch-empty-versions-test-updated-versions
        uses: ./
        with:
          path: tests/data/basic-test.json
          dependency: php
          with-summary: false

      - name: Validate "Empty versions"
        shell: bash
        env:
          ACTUAL_MIN: "${{ steps.fetch-empty-versions-test-updated-versions.outputs.min }}"
          EXPECTED_MIN: "null"
          ACTUAL_MAX: "${{ steps.fetch-empty-versions-test-updated-versions.outputs.max }}"
          EXPECTED_MAX: "null"
          ACTUAL_NEXT: "${{ steps.fetch-empty-versions-test-updated-versions.outputs.next }}"
          EXPECTED_NEXT: "${{ steps.fetch-empty-versions-test-original-versions.outputs.next }}" # Not expected to be updated
        run: |
          if [[ "$ACTUAL_MIN" != "$EXPECTED_MIN" ]]; then
            echo "::error::Invalid min version: expected '$EXPECTED_MIN', got '$ACTUAL_MIN' !"
            exit 1
          elif [[ "$ACTUAL_MAX" != "$EXPECTED_MAX" ]]; then
            echo "::error::Invalid max version: expected '$EXPECTED_MAX', got '$ACTUAL_MAX' !"
            exit 1
          elif [[ "$ACTUAL_NEXT" != "$EXPECTED_NEXT" ]]; then
            echo "::error::Invalid next version: expected '$EXPECTED_NEXT', got '$ACTUAL_NEXT' !"
            exit 1
          fi
